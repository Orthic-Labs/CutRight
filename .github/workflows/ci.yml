# CutRight CI — an adapter around scripts/gate.sh (hardening plan §7.4).
#
# The repository contract is the local script scripts/gate.sh; this workflow
# only runs it on hosted runners. It:
#   * runs the default gate on macOS + Ubuntu (Rust stable, pnpm from the
#     packageManager pin, Node 20);
#   * runs the headless QA lane (gate.sh --with-qa) on macOS only, because the
#     QA lane drives a real browser;
#   * caches only package/compiler caches (cargo registry+git, cargo target/,
#     pnpm store) — never generated project artifacts;
#   * records the exact commit and toolchain versions and publishes them as a
#     gate receipt artifact.
#
# No secrets are used or required.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pnpm version from packageManager pin
        id: pnpm
        run: |
          v="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"pnpm@\([0-9][0-9.]*\)".*/\1/p' apps/studio/package.json)"
          test -n "$v" || { echo "could not read packageManager pin from apps/studio/package.json" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            apps/studio/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'apps/studio/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Record commit and toolchain versions
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "os=${{ matrix.os }}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "pnpm=$(pnpm --version)"
            echo "node=$(node --version)"
          } | tee gate-receipt.txt

      - name: Run gate
        run: bash scripts/gate.sh

      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-receipt-${{ matrix.os }}
          path: gate-receipt.txt

  qa:
    name: gate + headless QA (macos)
    # The QA lane drives a real browser, so it runs on macOS only, after the
    # cross-platform gate has passed.
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pnpm version from packageManager pin
        id: pnpm
        run: |
          v="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"pnpm@\([0-9][0-9.]*\)".*/\1/p' apps/studio/package.json)"
          test -n "$v" || { echo "could not read packageManager pin from apps/studio/package.json" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            apps/studio/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'apps/studio/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run gate with headless QA
        run: bash scripts/gate.sh --with-qa
