[workspace]
resolver = "2"
members = [
  "crates/video-core",
  "crates/video-actions",
  "crates/video-benchmarks",
  "crates/video-capabilities",
  "crates/video-media",
  "crates/video-providers",
  "crates/video-project",
  "crates/video-jobs",
  "crates/video-runtime",
  "crates/video-security",
  "crates/video-recovery",
  "crates/video-cli",
  "crates/video-services",
  "crates/video-state",
  "crates/video-sessions",
  "crates/video-feedback",
  "crates/video-agent",
  "crates/video-editorial",
  "crates/video-protocol",
  "crates/video-daemon",
  "crates/video-driver-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Orthic Labs"]
# These crates are internal members of one application, not a published
# library set. Saying so explicitly prevents an accidental `cargo publish`
# and lets supply-chain tooling treat the intra-workspace `path` dependencies
# as what they are — local source, not unversioned registry wildcards.
publish = false

[workspace.dependencies]
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
