# Lane P-C: immutable project revision storage, append-only logs, migrations.
# Per `docs/architecture/V2-CRATE-DAG.md` this crate sits between `video-core`
# (lower) and the `video-project` orchestrator (higher). It MUST NOT depend on
# `video-actions`, `video-capabilities`, `video-project`, `video-cli`, or
# `apps/studio`. Lane P-C owns the canonical revision graph.

