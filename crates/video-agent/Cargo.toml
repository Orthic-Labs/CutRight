[package]
name = "video-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "CutRight loopback MCP adapter (CR-V2-B2-025). Exposes the same ActionExecutor as the CLI/Studio."

[package.metadata.cargo-machete]
# These are used by path-included binary modules, which machete cannot trace.
ignored = ["thiserror", "video-sessions"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
video-sessions = { path = "../video-sessions" }

[dev-dependencies]
tempfile = "3.23"
